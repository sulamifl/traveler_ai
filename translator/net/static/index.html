<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Translator AR — Групповой режим</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>Translator AR</span>
    </div>
    <div id="status" class="status-pill">
      <span class="dot"></span>
      <span id="status-text">Не подключено</span>
    </div>
  </header>

  <main>
    <section class="card">
      <h2 class="card-title">Подключение</h2>
      <div class="grid">
        <div class="field">
          <label for="session">Сессия</label>
          <input id="session" value="demo" />
        </div>
        <div class="field">
          <label for="pid">ID</label>
          <input id="pid" value="user1" />
        </div>
        <div class="field">
          <label for="name">Имя</label>
          <input id="name" value="User" />
        </div>
        <div class="field">
          <label for="lang">Мой язык</label>
          <select id="lang">
            <option value="ru">Русский</option>
            <option value="en" selected>English</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
          </select>
        </div>
        <div class="field">
          <label for="role">Роль</label>
          <select id="role">
            <option value="listener" selected>Слушатель</option>
            <option value="speaker">Говорящий</option>
          </select>
        </div>
      </div>
      <div class="row" style="margin-top: 12px;">
        <button id="connect" class="primary grow">Подключиться</button>
        <button id="disconnect" class="ghost" disabled>Отключиться</button>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">Реплика</h2>
      <div class="field">
        <textarea id="text" rows="2" placeholder="Введите текст реплики..."></textarea>
      </div>
      <div class="row" style="margin-top: 12px;">
        <div class="field grow">
          <label for="src">Исходный язык</label>
          <select id="src">
            <option value="ru">Русский</option>
            <option value="en" selected>English</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
          </select>
        </div>
        <button id="speak" class="primary" disabled>Сказать</button>
        <button id="question" class="ghost" disabled>Вопрос</button>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">Лента переводов</h2>
      <div id="log">
        <div class="empty">Пока пусто. Подключитесь и отправьте реплику.</div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a class="nav-item active" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Чат</span>
    </a>
    <a class="nav-item" href="/ar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <span>AR</span>
    </a>
  </nav>

  <script>
    const $ = (id) => document.getElementById(id);
    let ws = null;

    function log(text, meta, kind) {
      const logEl = $("log");
      const empty = logEl.querySelector(".empty");
      if (empty) empty.remove();
      const div = document.createElement("div");
      div.className = "entry" + (kind ? " " + kind : "");
      if (meta) {
        const m = document.createElement("div");
        m.className = "meta";
        m.textContent = meta;
        div.appendChild(m);
      }
      const t = document.createElement("div");
      t.className = "text";
      t.textContent = text;
      div.appendChild(t);
      logEl.prepend(div);
    }

    function setConnected(on) {
      $("connect").disabled = on;
      $("disconnect").disabled = !on;
      $("speak").disabled = !on;
      $("question").disabled = !on;
      $("status").classList.toggle("online", on);
      $("status-text").textContent = on ? "Подключено" : "Не подключено";
    }

    function connect() {
      const session = $("session").value.trim() || "demo";
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws/${encodeURIComponent(session)}`);
      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: "join",
          participant_id: $("pid").value.trim() || "user1",
          name: $("name").value.trim() || "User",
          language: $("lang").value,
          role: $("role").value,
        }));
        setConnected(true);
      };
      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === "translation") {
          log(msg.text, `→ ${msg.to} · ${msg.target_lang} · оригинал: ${msg.original}`);
        } else if (msg.type === "error") {
          log(msg.message, "ошибка", "error");
        } else if (msg.type === "joined") {
          log(`Вы вошли как ${msg.participant_id}`, "система", "system");
        }
      };
      ws.onclose = () => { setConnected(false); log("Соединение закрыто", "система", "system"); };
      ws.onerror = () => { log("Ошибка WebSocket", "система", "error"); };
    }

    function disconnect() {
      if (ws) { ws.close(); ws = null; }
    }

    function send(kind) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const text = $("text").value.trim();
      if (!text) return;
      ws.send(JSON.stringify({
        type: kind,
        participant_id: $("pid").value.trim() || "user1",
        text,
        source_lang: $("src").value,
      }));
      $("text").value = "";
    }

    $("connect").addEventListener("click", connect);
    $("disconnect").addEventListener("click", disconnect);
    $("speak").addEventListener("click", () => send("speak"));
    $("question").addEventListener("click", () => send("question"));
    $("text").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send("speak"); }
    });
  </script>
</body>
</html>
