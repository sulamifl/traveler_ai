[project]
name = "translator-ar"
version = "0.1.0"
description = "Синхронный переводчик с элементами дополненной реальности"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
stt = ["groq>=0.11"]
translate = ["httpx>=0.27"]
tts = ["edge-tts>=6.1"]
net = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12", "python-multipart>=0.0.9"]
ar = ["opencv-python-headless>=4.9", "pytesseract>=0.3.10", "Pillow>=10.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["translator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
